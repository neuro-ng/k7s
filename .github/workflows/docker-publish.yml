# k7s Docker publish pipeline — Phase 38.
#
# Builds and pushes two image variants to ghcr.io/neuro-ng/k7s:
#   :latest / :<version>       — distroless (Dockerfile at repo root)
#   :full   / :<version>-full  — batteries-included (docker/full/Dockerfile)
#
# Triggers:
#   • Push to main (snapshot images — no version tag)
#   • Version tags v*.*.* (release images)
#   • workflow_dispatch (manual run)
#
# Both variants are built for linux/amd64 and linux/arm64 via Docker Buildx.
# The :full image is scanned with Trivy before publishing; CRITICAL CVEs block
# the push.

name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to ghcr.io'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build & push :latest (distroless) ──────────────────────────────────────
  docker-latest:
    name: Build :latest (distroless)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push :latest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Attest build provenance
        if: github.event_name != 'workflow_dispatch' || inputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Build & scan :full (batteries-included) ────────────────────────────────
  docker-full:
    name: Build :full (batteries-included)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load tool versions
        run: |
          set -a
          source docker/full/versions.env
          set +a
          echo "KUBECTL_VERSION=${KUBECTL_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_VERSION=${HELM_VERSION}"       >> "$GITHUB_ENV"
          echo "VELA_VERSION=${VELA_VERSION}"       >> "$GITHUB_ENV"
          echo "TRIVY_VERSION=${TRIVY_VERSION}"     >> "$GITHUB_ENV"
          echo "GCLOUD_VERSION=${GCLOUD_VERSION}"   >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (:full)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=full,enable={{is_default_branch}}
            type=semver,pattern={{version}}-full
            type=semver,pattern={{major}}.{{minor}}-full

      - name: Build :full (load for scanning — amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/full/Dockerfile
          platforms: linux/amd64
          load: true
          tags: k7s-full-scan:latest
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
          build-args: |
            KUBECTL_VERSION=${{ env.KUBECTL_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            VELA_VERSION=${{ env.VELA_VERSION }}
            TRIVY_VERSION=${{ env.TRIVY_VERSION }}
            GCLOUD_VERSION=${{ env.GCLOUD_VERSION }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Scan :full image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k7s-full-scan:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker-full

      - name: Build and push :full (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/full/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
          provenance: mode=max
          sbom: true
          build-args: |
            KUBECTL_VERSION=${{ env.KUBECTL_VERSION }}
            HELM_VERSION=${{ env.HELM_VERSION }}
            VELA_VERSION=${{ env.VELA_VERSION }}
            TRIVY_VERSION=${{ env.TRIVY_VERSION }}
            GCLOUD_VERSION=${{ env.GCLOUD_VERSION }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Attest build provenance (:full)
        if: github.event_name != 'workflow_dispatch' || inputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
